services:
  postgres:
    image: postgres:18-alpine
    container_name: discord-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: discordbot
      POSTGRES_USER: discordbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - discord-bot-postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discordbot -d discordbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TZ=Europe/Paris
      - DATABASE_URL=Host=postgres;Port=5432;Database=discordbot;Username=discordbot;Password=${POSTGRES_PASSWORD}
    ports:
      - "8081:8080"
    env_file:
      - .env

volumes:
  discord-bot-postgres-data:
    name: discord-bot-postgres-data
