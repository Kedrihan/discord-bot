name: CI Build & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Tests NUnit & Vulnérabilités
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de .NET 10 (Preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restauration des dépendances
        run: dotnet restore DiscordBot.csproj

      - name: Compilation de la solution
        run: dotnet build DiscordBot.csproj --configuration Release --no-restore

      - name: Exécution des Tests Unitaires (NUnit)
        run: dotnet test tests/DiscordBot.Tests/DiscordBot.Tests.csproj --configuration Release

      - name: Audit des vulnérabilités NuGet (CVEs)
        run: dotnet list package --vulnerable --include-transitive || true
