services:
  postgres:
    image: postgres:17-alpine
    container_name: discord-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: discordbot
      POSTGRES_USER: discordbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discordbot -d discordbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TZ=Europe/Paris
      - DATABASE_URL=${DATABASE_URL:-postgresql://discordbot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/discordbot}
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env

volumes:
  postgres-data:
